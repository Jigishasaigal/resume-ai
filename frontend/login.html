<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ResumeAI Login</title>

    <link
        rel="stylesheet"
        href="css/auth.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>ResumeAI</h1>

        <p>Login to continue</p>

        <form id="loginForm">

            <input
                id="email"
                type="email"
                placeholder="Email"
                required>

            <input
                id="password"
                type="password"
                placeholder="Password"
                required>

            <button type="submit">

                Login

            </button>

        </form>

        <p id="errorMessage"></p>

        <p>

            Don't have an account?

            <a href="signup.html">

                Signup

            </a>

        </p>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>
</html>
