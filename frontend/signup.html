
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ResumeMatch | Signup</title>

    <link
        rel="stylesheet"
        href="css/auth.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>ResumeMatch</h1>

        <p>Create your account</p>

        <form id="signupForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <input
                type="text"
                id="college"
                placeholder="College">

            <input
                type="text"
                id="branch"
                placeholder="Branch">

            <input
                type="text"
                id="year"
                placeholder="Year">

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?

            <a href="login.html">
                Login
            </a>
        </p>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/signup.js"></script>

</body>
</html>
